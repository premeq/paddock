[package]
name = "paddock"
version = "0.1.0"
edition = "2021"
description = "Home screen for your herdr fleet: a standalone terminal client"
license = "MIT"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
